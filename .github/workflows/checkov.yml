name: Checkov
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli
          quiet: true