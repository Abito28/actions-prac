name: OIDC Test
on:
  push:
permissions:
  id-token: write
  contents: read
jobs:
  assume-role:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" | jq -R 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | {sub, aud, repository}'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::292967571286:role/github-actions-prac
          aws-region: ap-northeast-1
      - name: Who am I
        run: aws sts get-caller-identity